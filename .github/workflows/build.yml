name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          DIR="$(dirname "$(find . -name build.gradle.kts -not -path './.git/*' | head -1)")"
          echo "Projekt in: $DIR"
          cd "$DIR"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: fabismp-core
          path: '**/build/libs/fabismp-core.jar'
